name: Blender EP9 Sample

on:
  push:
    branches: [main]
    paths:
      - 'blender-ep9.json'
      - '.github/workflows/blender-ep9.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: c1, args: "anim 1 53"}
          - {name: c2, args: "anim 54 106"}
          - {name: c3, args: "anim 107 159"}
          - {name: c4, args: "anim 160 210"}
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libegl1 libgl1 libglx0 libxi6 libxkbcommon0 libxrender1 libxrandr2 fonts-dejavu-core > /dev/null
      - name: Download Blender 4.2
        run: |
          curl -sL -o blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz
          tar -xf blender.tar.xz
          ls blender-4.2.0-linux-x64/blender
      - name: Render chunk ${{ matrix.name }}
        working-directory: projects/insurance-blender-sample/blender
        run: |
          mkdir -p frames
          xvfb-run -a $GITHUB_WORKSPACE/blender-4.2.0-linux-x64/blender -b -P scene_ep9.py -- ${{ matrix.args }}
          ls frames/ | wc -l
      - name: Upload frames
        uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.name }}
          path: projects/insurance-blender-sample/blender/frames/*.png
          if-no-files-found: error

  finish:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble sequence and encode
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          python3 - <<'PYEOF'
          import os, shutil, glob
          os.makedirs('seq', exist_ok=True)
          for i in range(1, 211):
              hits = glob.glob(f'artifacts/**/f_{i:04d}.png', recursive=True)
              assert hits, i
              shutil.copy(hits[0], f'seq/{i:04d}.png')
          assert len(os.listdir('seq')) == 210
          print('assembled 210 frames')
          PYEOF
          ffmpeg -y -v error -ss 0 -t 6.63 -i projects/insurance-cinematic/audio/final_audio.wav voice_clip.wav
          ffmpeg -y -v error -framerate 30 -i seq/%04d.png -i voice_clip.wav -af "apad=pad_dur=1" -c:v libx264 -pix_fmt yuv420p -crf 17 -preset medium -c:a aac -b:a 160k -t 7.0 sample_blender3d.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 sample_blender3d.mp4
      - name: Publish release with the video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="blender-ep9-sample-${{ github.run_number }}"
          gh release create "$TAG" sample_blender3d.mp4 \
            --title "Blender EP9 3D sample run ${{ github.run_number }}" \
            --notes "Blender 4.2 Eevee render on GitHub Actions (4 parallel chunks, 210 frames, 1080x1920)"
